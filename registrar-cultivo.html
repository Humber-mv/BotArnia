<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotArnia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&family=Montserrat&family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/registro.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
    <header>
        <div id="nav-container"></div>
    </header>

    <main>
        <div class="container">
            <section class="crop-log">
                <div class="log-top">
                    <h1><span>Registro</span> de nuevo cultivo</h1>
                    <p>Ingresá los detalles de tu siembra para incluirla a tu control de cultivos</p>
                </div>

                <div class="crop-content">
                    <form class="crop-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nombre">Nombre del cultivo <span class="asterisco">*</span></label>
                                <input type="text" id="nombre" name="nombre" placeholder="Tomate" required>
                                <small id="nombre-error"></small>
                            </div>
                            <div class="form-group">
                                <label for="categoria">Categoría <span class="asterisco">*</span></label>
                                <select name="categoria" id="categoria" required>
                                    <option value="">Seleccione una categoría</option>
                                    <option value="vegetal">Vegetal</option>
                                    <option value="frutal">Frutal</option>
                                    <option value="hierba">Hierba</option>
                                    <option value="cereal">Cereal</option>
                                    <option value="ornamental">Ornamental</option>
                                </select>
                                <small id="categoria-error"></small>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="fecha">Fecha de siembra <span class="asterisco">*</span></label>
                                <input type="date" id="fecha" name="fecha" required>
                            </div>
                            <div class="form-group">
                                <label for="frecuencia-riego">Frecuencia de riego <span class="asterisco">*</span></label>
                                <select name="frecuenciaRiego" id="frecuencia-riego" required>
                                    <option value="">Seleccione una frecuencia</option>
                                    <option value="diario">Diario</option>
                                    <option value="cada-2-dias">Cada 2 días</option>
                                    <option value="cada-3-dias">Cada 3 días</option>
                                    <option value="semanal">Semanal</option>
                                    <option value="quincenal">Quincenal</option>
                                    <option value="segun-necesidad">Según necesidad</option>
                                </select>
                                <small id="frecuenciaRiego-error"></small>
                            </div>
                        </div>

                        <div class="form-group toggle-group">
                            <label for="plaga">¿Tiene plaga activa?</label>
                            <div class="toggle-row">
                                <span>Activar si hay plaga o algún problema</span>
                                <input type="checkbox" id="plaga" name="plaga">
                            </div>
                        </div>

                        <div class="plaga-fields" id="plaga-fields">
                            <div class="form-group">
                                <label for="tipo-plaga">Tipo de plaga <span class="asterisco">*</span></label>
                                <select id="tipo-plaga" name="tipoPlaga">
                                    <option value="">Seleccioná un tipo</option>
                                    <option value="afidos">Áfidos</option>
                                    <option value="mosca-blanca">Mosca blanca</option>
                                    <option value="hongos">Hongos</option>
                                    <option value="otros">Otros</option>
                                </select>
                                <small id="tipoPlaga-error"></small>
                            </div>
                            <div class="form-group">
                                <label for="observaciones">Observaciones</label>
                                <textarea id="observaciones" name="observaciones" placeholder="Hojas amarillas en la parte baja..."></textarea>
                            </div>
                        </div>
                        <div class="form-buttons">
                            <button type="submit" class="registrar">Registrar cultivo</button>
                            <button type="reset" class="limpiar">Limpiar</button>
                        </div>
                    </form>    
                    <div class="crop-preview">
                        <p><i class="fa-solid fa-circle-info" style="color: rgb(98, 149, 200);"></i> Aquí se mostrará la vista previa</p>
                    </div>
                </div>
            </section>
            
            <section class="saved-crops">
                <h2>Cultivos registrados</h2>
                <div class="saved-crops-list"></div>
            </section>
        </div>
    </main>
    
    <div class="toast-success">
        <i class="fa-solid fa-circle-check" style="color: #71c530;"></i>
        <div class="content">
            <h4>Éxito</h4>
            <p class="toast-message"></p>
        </div>
    </div>

    <div id="footer-container"></div>
    <script src="js/nav-footer.js"></script>
    <script src="js/registro.js"></script>

</body>
</html>
