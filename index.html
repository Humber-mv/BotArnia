<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotArnia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&family=Montserrat&family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
    <header>
        <div id="nav-container"></div>
    </header>

    <main>
        <div class="container">
            <section class="hero-section">
                <div class="hero-content">
                    <div class="text">
                        <h1>Tu campo, <span>organizado</span> <br>e inteligente</h1>
                        <p>Registrá, monitoreá y tomá decisiones sobre tus cultivos</p>
                    </div>
                    <div class="hero-links">
                        <a href="mis-cultivos.html" class="btn-primary">Ver mis cultivos</a>
                        <a href="registrar-cultivo.html" class="btn-secundary">Registrar cultivo</a>
                    </div>
                </div>
                <div class="hero-dash">
                    <p class="dash-title">Acerca de tus <span id="crops-total">0</span> cultivos</p>
                    <div class="dash-metrics">
                        <div class="metric">
                            <span class="metric-number" id="healthy-total">0</span>
                            <span class="metric-label">Saludables</span>
                        </div>
                        <div class="metric">
                            <span class="metric-number" id="attention">0</span>
                            <span class="metric-label">Necesitan atención</span>
                        </div>
                        <div class="metric">
                            <span class="metric-number" id="risk-total">0</span>
                            <span class="metric-label">En riesgo</span>
                        </div>
                    </div>
                </div>
            </section>

            
        </div>
    </main>
    
    <div id="footer-container"></div>
    <script src="js/nav-footer.js"></script>
</body>
</html>
