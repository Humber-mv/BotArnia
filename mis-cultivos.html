<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotArnia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter&family=Montserrat&family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/cultivos.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
    <header>
        <div id="nav-container"></div>
    </header>

    <main>
        <div class="container">
            <section class="cultivos-header">

                <div class="top-text">
                    <h1><span>Mis</span> cultivos</h1>
                    <p>Gestioná y monitoreá tus cultivos en un solo lugar</p>
                </div>
                
                <div class="toolbar">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="search" id="search-cultivo" placeholder="Buscar cultivo por nombre...">
                    </div>
                    <div class="filter-cleaner">
                        <i class="fa-solid fa-arrow-rotate-left"></i>
                        <button>Limpiar filtros</button>
                    </div>
                </div>
                
                <div class="filters">
                    <div class="category-filter">
                        <p>Categoría</p>
                        <button class="btn-categoria all-category">Todos</button>
                        <button class="btn-categoria vegetable">Vegetales</button>
                        <button class="btn-categoria fruits">Frutas</button>
                        <button class="btn-categoria herbs">Hierbas</button>
                        <button class="btn-categoria cereals">Cereales</button>
                        <button class="btn-categoria ornamentals">Ornamentales</button>
                    </div>

                    <div class="health-filter">
                        <p>Estado de salud</p>
                        <button class="btn-estado all-state">Todos</button>
                        <button class="btn-estado healthy">Saludables</button>
                        <button class="btn-estado attention">Necesitan atención</button>
                        <button class="btn-estado risk">En riesgo</button>
                    </div>
                </div>
            </section>

            <section class="cultivos-list">
                <div class="no-results-message">
                    <i class="fa-solid fa-seedling"></i>
                    <h3>Sin resultados</h3>
                    <p>Cambie los filtros para visualizar otros cultivos disponibles.</p>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="js/nav-footer.js"></script>
    <script src="js/cultivos.js"></script>

</body>
</html>
